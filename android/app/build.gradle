apply plugin: 'com.android.application'

android {
    namespace = "com.eusebiodev.pickupliz"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.eusebiodev.pickupliz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1019
        versionName "1.0.19"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // ============================================================
        // 🚀 OPTIMIZACIONES PARA REDUCIR TAMAÑO
        // ============================================================

        // 1️⃣ Solo conserva los idiomas que usa tu app (español e inglés)
        //    Elimina los demás (francés, alemán, italiano, etc.) – ahorra ~1-2 MB
        resConfigs "es", "en"

        // 2️⃣ Filtra las arquitecturas de librerías nativas
        //    Deja solo las más comunes (elimina x86, x86_64) – ahorra ~3-5 MB
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // ============================================================
            // 🔥 OFUSCACIÓN Y REDUCCIÓN DE CÓDIGO/RECURSOS
            // ============================================================
            minifyEnabled true               // Activa R8 (ofusca y elimina código muerto)
            shrinkResources true             // Elimina recursos no utilizados (imágenes, layouts, etc.)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Opcional: desactiva los logs de depuración en release
            buildConfigField "boolean", "DEBUG", "false"
        }
    }

    // ============================================================
    // 🗑️ EXCLUIR ARCHIVOS INNECESARIOS DEL APK/AAB
    // ============================================================
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"   // Evita duplicados de licencias
            excludes += "/protobuf.meta"             // Archivo de metadatos de Firebase
        }
    }
}

// Repositorios para plugins de Capacitor/Cordova
repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// ============================================================
// 📦 DEPENDENCIAS
// ============================================================
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

// ============================================================
// ✅ APLICA GOOGLE SERVICES SOLO SI EXISTE google-services.json
// ============================================================
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.warn("google-services.json not found. Push notifications will NOT work.")
    }
} catch(Exception e) {
    logger.warn("google-services.json not found. Push notifications will NOT work.")
}